#        uses: actions/upload-artifact@v7
#        with:
#          path: llama-${{ needs.check-release.outputs.tag_name }}-bin-${{ matrix.chip_type }}-openEuler-${{ matrix.arch }}${{ matrix.use_acl_graph == 'on' && '-aclgraph' || '' }}.tar.gz
#          archive: false

  ui-build:
    needs: [check-release]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    uses: ./.github/workflows/ui-build.yml

  release:
    # publish whatever built: a failed optional backend must not block the release
    if: ${{ !cancelled() && needs.ui-build.result == 'success' && (github.event_name == 'push' || github.event.inputs.create_release == 'true') }}

    # Fine-grant permission
    # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write # create the release and its tag
      id-token: write
      attestations: write

    runs-on: ubuntu-slim

    needs:
      - check-release
      - macos-cpu
      - ubuntu-cpu
      - ubuntu-vulkan
      - ubuntu-cuda
      - android-arm64
      - android-arm64-snapdragon
      - linux-arm64-snapdragon
      - ubuntu-24-openvino
      - windows-openvino
      - windows-cpu
      - windows-rocm
      - windows
      - windows-cuda
      - windows-sycl
      - ubuntu-24-sycl
      - ubuntu-24-rocm
      - ios-xcode
      #- openEuler-cann
      - ui-build

    steps:
      - name: Download artifacts
        id: download-artifact
        uses: actions/download-artifact@v8
        with:
          path: ./artifact
          merge-multiple: true
          skip-decompress: true

      - name: Merge artifacts
        id: move_artifacts
        run: |
          mkdir -p release

          # the windows-cpu zip contains the full toolset (llama-server with the embedded
          # UI, ggml-cpu) - inject it into the other windows zips so that every archive
          # ships the same binaries, only with a different backend library on top
          echo "Injecting windows-cpu binaries (llama-server + CPU backend) into the backend zips..."
          for arch in x64 arm64; do
            cpu_zip="artifact/llama-bin-win-cpu-${arch}.zip"
            if [ ! -f "$cpu_zip" ]; then
              # without it the backend zips of this arch would hold a lone backend
              # library and no llama-server: do not publish them
              echo "No windows-cpu-${arch} package: dropping the ${arch} backend zips"
              rm -fv artifact/llama-bin-win-*-${arch}.zip
              continue
            fi
            temp_dir=$(mktemp -d)
            echo "Extracting windows-cpu-${arch} package..."
            unzip -q "$cpu_zip" -d "$temp_dir"

            echo "Merging into $arch zips..."
            for target_zip in artifact/llama-bin-win-*-${arch}.zip; do
              if [[ "$target_zip" == "$cpu_zip" ]]; then
                continue
              fi
              echo "Injecting into $(basename "$target_zip")"
              realpath_target_zip=$(realpath "$target_zip")
              (cd "$temp_dir" && zip -qr "$realpath_target_zip" .)
            done

            rm -rf "$temp_dir"
          done

          echo "Renaming and moving zips to release..."
          for zip_file in artifact/llama-bin-win-*.zip; do
            [ -f "$zip_file" ] || continue
            base_name=$(basename "$zip_file" .zip)
            zip_name="llama-${{ needs.check-release.outputs.tag_name }}-${base_name#llama-}.zip"
            echo "Moving $zip_file to release/$zip_name"
            mv "$zip_file" "release/$zip_name"
          done

          echo "Moving other artifacts..."
          # the UI is packaged below from its own download
          rm -f artifact/llama-ui.zip
          mv -v artifact/*.zip release || true
          mv -v artifact/*.tar.gz release || true

      - name: Download UI build
        id: download_ui
        uses: actions/download-artifact@v8
        with:
          name: llama-ui.zip
          path: ./ui-dist

      - name: Package UI
        id: package_ui
        run: |
          tar -czvf release/llama-${{ needs.check-release.outputs.tag_name }}-ui.tar.gz --transform "s,^\.,llama-${{ needs.check-release.outputs.tag_name }}," -C ./ui-dist .

      - name: Checksums and manifest
        run: |
          cd release
          sha256sum * > SHA256SUMS
          {
            echo "fork commit: ${{ github.sha }}"
            echo "tag: ${{ needs.check-release.outputs.tag_name }}"
            echo
            cat SHA256SUMS
          } > MANIFEST.txt
          ls -l

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: 'release/*'

      # The body lists the archives that are in release/ and nothing else, so it
      # never links a build that failed. It replaces upstream's hardcoded list.
      - name: Write release notes
        id: notes
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUILD_TAG: ${{ needs.check-release.outputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
          else
            # rolling release, replaced by every run on this branch
            TAG="latest-$(echo "$REF_NAME" | tr '/' '-')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          base="https://github.com/$REPO/releases/download/$TAG"
          docs="https://github.com/$REPO/blob/$SHA/docs/backend"
          prefix="llama-$BUILD_TAG-"
          parts=$(mktemp -d)
          listed=" "

          # add <section> <rank> <label> <file> [text after the link]
          add() {
            echo "- [$3]($base/$4)${5:-}" >> "$parts/$1.$2"
            listed="$listed$4 "
          }

          for path in release/*; do
            f=$(basename "$path")
            [[ "$f" == "$prefix"* ]] || continue
            key="${f#"$prefix"}"
            key="${key%.tar.gz}"
            key="${key%.zip}"
            case "$key" in
              bin-macos-arm64)
                add 1-apple 10 "macOS Apple Silicon (arm64)" "$f" ;;
              bin-macos-x64)
                add 1-apple 20 "macOS Intel (x64)" "$f" ;;
              xcframework)
                add 1-apple 30 "iOS XCFramework" "$f" ;;
              bin-linux-arm64-snapdragon)
                add 2-linux 80 "Linux arm64 (Snapdragon: CPU, Adreno GPU, Hexagon NPU)" "$f" " - [setup guide]($docs/snapdragon/linux.md)" ;;
              bin-android-arm64)
                add 4-android 10 "Android arm64 (CPU)" "$f" ;;
              bin-android-arm64-snapdragon)
                add 4-android 80 "Android arm64 (Snapdragon: CPU, Adreno GPU, Hexagon NPU)" "$f" " - [setup guide]($docs/snapdragon/README.md)" ;;
              ui)
                add 5-ui 10 "Web UI (static files, already embedded in llama-server)" "$f" ;;
              bin-ubuntu-*|bin-win-*)
                # <backend>[-<version>]-<arch>, the Ubuntu 26.04 builds with 26.04 before the arch
                if [[ "$key" == bin-ubuntu-* ]]; then
                  os="Ubuntu"; section="2-linux"; rest="${key#bin-ubuntu-}"
                else
                  os="Windows"; section="3-windows"; rest="${key#bin-win-}"
                fi
                arch="${rest##*-}"
                mid=""
                if [[ "$rest" == *-* ]]; then mid="${rest%-*}"; fi
                # the runtime libraries of a CUDA build are a separate archive
                runtime=""
                if [[ "$mid" == cuda-* ]]; then
                  if [[ "$os" == "Ubuntu" ]]; then
                    runtime="cudart-llama-$BUILD_TAG-bin-ubuntu-$mid-$arch.tar.gz"
                  else
                    runtime="cudart-llama-bin-win-$mid-$arch.zip"
                  fi
                fi
                if [[ "$mid" == "26.04" ]]; then
                  os="$os 26.04"; mid=""
                elif [[ "$mid" == *-26.04 ]]; then
                  os="$os 26.04"; mid="${mid%-26.04}"
                fi
                case "$mid" in
                  ""|cpu)        rank=10; backend="CPU" ;;
                  vulkan)        rank=20; backend="Vulkan" ;;
                  cuda-*)        rank=30; backend="CUDA ${mid#cuda-}" ;;
                  rocm-*)        rank=40; backend="ROCm ${mid#rocm-}" ;;
                  sycl)          rank=50; backend="SYCL" ;;
                  sycl-*)        rank=50; v="${mid#sycl-}"; backend="SYCL ${v^^}" ;;
                  openvino-*)    rank=60; backend="OpenVINO ${mid#openvino-}" ;;
                  opencl-adreno) rank=70; backend="OpenCL Adreno" ;;
                  *)             rank=90; backend="$mid" ;;
                esac
                extra=""
                if [[ -n "$runtime" && -f "release/$runtime" ]]; then
                  extra=" - [$backend runtime libraries]($base/$runtime)"
                  listed="$listed$runtime "
                fi
                add "$section" "$rank" "$os $arch ($backend)" "$f" "$extra" ;;
            esac
          done

          # print_section <id> <title>: nothing when no archive of that platform was built
          print_section() {
            compgen -G "$parts/$1.*" > /dev/null || return 0
            echo
            echo "**$2**"
            cat "$parts/$1".*
          }

          {
            echo "llama-server builds of the OVH Olala fork of llama.cpp."
            echo
            echo "- Commit: [\`${SHA:0:9}\`](https://github.com/$REPO/commit/$SHA)"
            echo "- Build: \`$BUILD_TAG\` (the name inside every archive), release tag: \`$TAG\`"
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "- Rolling release: every build of \`$REF_NAME\` replaces it"
            fi
            if [[ -f release/SHA256SUMS ]]; then
              echo "- Checksums: [SHA256SUMS]($base/SHA256SUMS). Check the files you downloaded with \`sha256sum -c SHA256SUMS --ignore-missing\`"
            fi
            if [[ -f release/MANIFEST.txt ]]; then
              echo "- Manifest: [MANIFEST.txt]($base/MANIFEST.txt) (the commit and the same checksums)"
            fi
            if [[ -n "$ATTESTATION_URL" ]]; then
              echo "- Attestations: <$ATTESTATION_URL>. Check a file with \`gh attestation verify <file> --repo $REPO\`"
            fi

            if [[ -n "$COMMIT_MESSAGE" ]]; then
              echo
              echo "<details>"
              echo "<summary>Commit message</summary>"
              echo
              printf '%s\n' "$COMMIT_MESSAGE"
              echo
              echo "</details>"
            fi

            print_section 1-apple   "macOS/iOS:"
            print_section 2-linux   "Linux:"
            print_section 3-windows "Windows:"
            print_section 4-android "Android:"
            print_section 5-ui      "UI:"

            # whatever the cases above do not know yet is still listed
            other=""
            for path in release/*; do
              f=$(basename "$path")
              case "$f" in SHA256SUMS|MANIFEST.txt) continue ;; esac
              if [[ "$listed" != *" $f "* ]]; then
                other="$other- [$f]($base/$f)"$'\n'
              fi
            done
            if [[ -n "$other" ]]; then
              echo
              echo "**Other files:**"
              printf '%s' "$other"
            fi

            if compgen -G "$parts/3-windows.*" > /dev/null; then
              echo
              echo "Every Windows archive is complete: llama-server with the backend it is named after."
            fi

            # a job with several builds counts as failed when one of them failed
            failed=$(printf '%s\n' "$NEEDS_JSON" | awk '
              /^  "[^"]+": \{/ { job = $1; gsub(/[":]/, "", job) }
              /^    "result": /  { res = $2; gsub(/[",]/, "", res); if (res != "success") print "- `" job "`: " res }
            ')
            if [[ -n "$failed" ]]; then
              echo
              echo "**Jobs that did not fully succeed** (their archives, or some of them, are missing above):"
              printf '%s\n' "$failed"
            fi
          } > notes.md

          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create release
        env:
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            # rolling release, replaced by every run on this branch
            gh release delete "$TAG" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          fi
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "llama-server $TAG (Olala fork)" \
            --notes-file notes.md

  # upstream's `ui-publish` job is not here: it uploads the UI to upstream's
  # Hugging Face bucket with a token secret. The UI is published in the release
  # instead (llama-<tag>-ui.tar.gz).
